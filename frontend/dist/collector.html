<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BettaFish采集端状态</title><style>body{background:#061221;color:#d8eaff;font:15px/1.7 system-ui,'Microsoft YaHei';max-width:980px;margin:36px auto;padding:0 24px}a{color:#60caff}article{background:#0c2135;border:1px solid #193b58;border-radius:8px;padding:20px;margin:16px 0}small{color:#86a6bf}img{max-width:230px;background:white;padding:10px;display:block;margin-top:12px}b{color:#68d4ff}.error{color:#ff889a}h1{font-size:25px}</style><h1>BettaFish / MindSpider 采集端</h1><p>首次在独立 Edge 窗口扫码登录。平台要求验证时请手动完成；不要在聊天里发送密码、Cookie 或验证码。此页每5秒读取实际状态。</p><a href="/">返回量化大屏 ↗</a><div id="status">正在读取状态…</div><small>内容与评论写入本机数据库，评论通过只读导出进入大屏。未采到评论时保持0；未评分不算中性。只有完成首次采集的平台才自动加入每日运行。</small><script>
const escapeHtml=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={wb:'微博',xhs:'小红书',dy:'抖音'},states={ready_for_login:'就绪，等待首次登录',running:'运行中',idle:'本轮已结束',starting:'正在启动',collecting:'采集中',awaiting_login:'等待扫码',login_required:'需要重新登录',manual_verification:'等待手动验证',completed:'本轮完成',error:'本轮未完成',timeout:'超时'};
async function refresh(){try{const response=await fetch('/api/context',{cache:'no-store'});if(!response.ok)throw Error(response.status);const data=await response.json(),collector=data.bettafish?.collector||{},platforms=collector.platforms||{};document.querySelector('#status').innerHTML=`<article><b>运行状态：${escapeHtml(states[collector.status]||collector.status||'尚未初始化')}</b><p>数据库表：${escapeHtml(collector.database?.tables)} · 当前24小时真实评论：${data.bettafish?.status?.comments??0}</p></article>`+Object.keys(names).map(id=>{const row=platforms[id]||{};return `<article><h2>${names[id]}</h2><b>${escapeHtml(states[row.status]||row.status||'尚未启动')}</b><p>${escapeHtml(row.message||'首次登录运行：Start-Sentiment-Collector.ps1 -Platforms '+id)}</p><small>${escapeHtml(row.updated_at||row.started_at)}</small>${row.status==='awaiting_login'&&row.login_image?`<img src="/collector/login/${id}.png?at=${encodeURIComponent(row.updated_at)}" alt="${names[id]}采集端登录二维码，请用手机App扫码">`:''}${row.error_type?`<p class="error">${escapeHtml(row.error_type)}</p>`:''}</article>`}).join('')}catch(error){document.querySelector('#status').textContent='无法读取本机采集状态：'+error.message}}refresh();setInterval(refresh,5000);
</script></html>
