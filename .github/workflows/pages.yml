name: Publish public dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '25 8 * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      # Seed is allowlisted public data, never the local API or raw database.
      - run: python -m deploy.public_site --seed deploy/seed/context.json
      - run: python -m quantlab.markets collect
        continue-on-error: true
      - run: python -m quantlab.social collect
        continue-on-error: true
      - run: python -m deploy.public_site --merge-public-seed deploy/seed/context.json
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
